<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity Companies</title><meta name="description" content="Forward deployed AI engineering companies built on Infinity.">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0D12;--ink2:#3B4150;--line:#E3E6EB;--red:#E31E30}*{box-sizing:border-box}
body{margin:0;font-family:"Inter Tight",Arial,sans-serif;color:var(--ink);background:#fff}
header{background:var(--ink);color:#F3F4F6;padding:88px 24px 72px}
.wrap{max-width:1100px;margin:0 auto}
.eb{font:500 12px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#C9CDD6}
h1{font-weight:300;font-size:clamp(40px,7vw,80px);letter-spacing:-.03em;line-height:1.02;margin:16px 0}
h1 b{font-weight:500;color:#fff;border-bottom:4px solid var(--red)}
header p{color:#C9CDD6;font-size:19px;max-width:56ch}
main{padding:56px 24px 88px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:24px;transition:border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.card h3{margin:14px 0 8px;font-weight:500;font-size:22px}.card p{margin:0 0 14px;color:var(--ink2)}
.meta{font:500 12px "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#6A7080}
footer{border-top:1px solid var(--line);padding:22px 24px;color:#6A7080;font-size:13px}
</style></head><body>
<header><div class="wrap"><div class="eb">Infinity</div><h1>We build. We deliver. <b>You lead.</b></h1>
<p>Forward deployed AI engineering companies, each led by its founder, each built on the CodeNinja platform.</p></div></header>

<footer><div class="wrap">Built on CodeNinja</div></footer></body></html>
